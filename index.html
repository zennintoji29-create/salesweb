  <!-- Synchronous Admin API Fetch Interceptor -->
  <script>
    (function setupGlobalApiInterceptor() {
      var origFetch = window.fetch;
      window.fetch = function(input, init) {
        init = init || {};
        var adminKey = '';
        try {
          adminKey = localStorage.getItem('tokyo_drift_admin_auth') || 
                     sessionStorage.getItem('tokyo_drift_admin_auth') || '';
        } catch(e) {}

        var urlStr = typeof input === 'string' ? input : (input && input.url ? input.url : '');
        if (adminKey && urlStr.indexOf('/api/') !== -1) {
          if (!init.headers) {
            init.headers = {};
          }
          if (init.headers instanceof Headers) {
            if (!init.headers.has('x-admin-key')) {
              init.headers.set('x-admin-key', adminKey);
            }
          } else if (Array.isArray(init.headers)) {
            var hasKey = false;
            for (var i = 0; i < init.headers.length; i++) {
              if (init.headers[i][0].toLowerCase() === 'x-admin-key') { hasKey = true; break; }
            }
            if (!hasKey) init.headers.push(['x-admin-key', adminKey]);
          } else if (typeof init.headers === 'object') {
            if (!init.headers['x-admin-key'] && !init.headers['X-Admin-Key']) {
              init.headers['x-admin-key'] = adminKey;
            }
          }
        }
        return origFetch.call(this, input, init);
      };
    })();
  </script>

      const sanitized = numStr.replace(/\D/g, '');

      let sum = 0;
      let shouldDouble = false;
      for (let i = sanitized.length - 1; i >= 0; i--) {
        let digit = parseInt(sanitized.charAt(i), 10);
        if (shouldDouble) {
          digit *= 2;
          if (digit > 9) digit -= 9;
        }
        sum += digit;
        shouldDouble = !shouldDouble;
      }
      return (sum % 10) === 0;

        else if (fitHeight < 172 || fitWeight < 66) baseSizeIndex = 1;
        else if (fitHeight < 180 && fitWeight < 78) baseSizeIndex = 2;
        else if (fitHeight < 187 || fitWeight < 90) baseSizeIndex = 3;
        else if (fitHeight < 194 || fitWeight < 102) baseSizeIndex = 4;
        else baseSizeIndex = 5;

        if (fitPreference === 'oversized' && baseSizeIndex < 5) baseSizeIndex += 1;
        if (fitPreference === 'sculpted' && baseSizeIndex > 0) baseSizeIndex -= 1;

        const sizes = ['XS', 'S', 'M', 'L', 'XL', 'XXL'];

      const optimizePhotoFile = (file) => {
        return new Promise((resolve) => {
          const img = new Image();
          const objUrl = URL.createObjectURL(file);
          img.onload = () => {
            URL.revokeObjectURL(objUrl);
            const maxDim = 1600;
            let { width, height } = img;
            if (width > maxDim || height > maxDim) {
              if (width > height) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              } else {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.88));
          };
          img.onerror = () => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result);
            reader.readAsDataURL(file);
          };
          img.src = objUrl;
        });
      };

            size: it.size,
            quantity: it.quantity,
            price: it.product.price,
            image: it.product.primaryImage
          })),
          financials: {
            subtotal,
            discount: discountAmount,
            discountPercent: activeDiscount,
            shippingFee,
            codHandlingFee: isCod ? (settings.codHandlingFee || 50) : 0,
            grandTotal,
            currency: currency
          },
          payment: {
            method: checkoutForm.paymentMethod,
            gateway: checkoutForm.paymentMethod === 'upi' ? 'direct-upi-settlement' : (checkoutForm.paymentMethod === 'card' ? 'card-gateway' : 'cash-on-delivery'),
            utr: checkoutForm.paymentMethod === 'upi' ? youpiUtrVal : (checkoutForm.codUtr || null),
            vpa: checkoutForm.paymentMethod === 'upi' ? (settings.youpiVpa || 'agarawalrishav23@okaxis') : null,
            payeeName: checkoutForm.paymentMethod === 'upi' ? (settings.youpiPayeeName || 'Rishav Kumar') : null,
            autoVerified: upiIsAutoVerified,
            pendingReview: checkoutForm.paymentMethod === 'upi' && !upiIsAutoVerified,
            label: checkoutForm.paymentMethod === 'card' 
              ? `Credit / Debit Card (${cardBrand})`
              : checkoutForm.paymentMethod === 'upi'
                ? (upiIsAutoVerified
                    ? `Direct Instant UPI · Ref: ${youpiUtrVal} (${settings.youpiVpa || 'agarawalrishav23@okaxis'})`
                    : `Direct UPI (Concierge Verification Pending) · Ref: ${youpiUtrVal}`)
                : (settings.enableCodAdvanceShipping !== false 
                    ? `Cash on Delivery (Advance Shipping ₹${shippingFee} Pre-Confirmed + ₹${settings.codHandlingFee || 50} Handling)` 
                    : 'Cash on Delivery (COD)'),
            cardBrand: checkoutForm.paymentMethod === 'card' ? cardBrand : (checkoutForm.paymentMethod === 'upi' ? 'UPI' : 'COD'),
            last4: checkoutForm.paymentMethod === 'card' 
              ? checkoutForm.cardNumber.replace(/\D/g, '').slice(-4) 
              : (checkoutForm.paymentMethod === 'upi' 
                  ? youpiUtrVal.slice(-4) 
                  : (checkoutForm.codUtr ? checkoutForm.codUtr.slice(-4) : 'COD')),
            codAdvanceFee: checkoutForm.paymentMethod === 'cod' ? shippingFee : 0,
            codHandlingFee: checkoutForm.paymentMethod === 'cod' ? (settings.codHandlingFee || 50) : 0,
            codBalanceDue: checkoutForm.paymentMethod === 'cod' ? codDoorstepBalance : 0,
            codUtr: checkoutForm.codUtr || 'PRE-AUTH-ADVANCE',
            transactionHash: checkoutForm.paymentMethod === 'card'
              ? 'AUTH_' + Math.random().toString(36).substring(2, 12).toUpperCase()
              : checkoutForm.paymentMethod === 'upi'
                ? 'SETTLEMENT_REF_' + youpiUtrVal
                : (checkoutForm.codUtr 
                    ? `COD_ADV_${checkoutForm.codUtr.toUpperCase()}`
                    : `COD_ADV_REF_${Math.floor(100000000000 + Math.random() * 900000000000)}`)
          }
        };

        // Deduct inventory locally
        setProducts(prevProducts => {
          return prevProducts.map(p => {
            const bagItemsForProduct = bag.filter(b => b.product.id === p.id);
            if (bagItemsForProduct.length > 0 && p.stock) {
              const updatedStock = { ...p.stock };
              bagItemsForProduct.forEach(item => {
                if (updatedStock[item.size] !== undefined) {
                  updatedStock[item.size] = Math.max(0, updatedStock[item.size] - item.quantity);
                }
              });
              return { ...p, stock: updatedStock };
            }
            return p;
          });
        });

        // Record order in state & SQLite backend
        setOrders(prev => [newOrder, ...prev]);

        let authoritativeOrder = newOrder;
        try {
          const res = await fetch('/api/orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newOrder)
          });
          if (res.ok) {
            const data = await res.json();
            if (data && data.order) {
              authoritativeOrder = data.order;
              setOrders(prev => prev.map(o => o.id === authoritativeOrder.id ? authoritativeOrder : o));
            }
          }
        } catch (e) {}

        setTimeout(() => {
          setIsProcessingPayment(false);
          setCurrentOrder(authoritativeOrder);
          setOrderSuccess(true);
          setBag([]);
          setUpiAutoVerified(false);
          setUpiDetectedCredit(null);
          setUpiFallbackOpen(false);
          setUpiSecondsElapsed(0);
          playHapticTone(1050, 0.08, settings.enableSound);
        }, 1200);
      };

      // 1-Click Export Database Backup (.JSON)
      const exportDatabaseJson = () => {
        const fullBackup = {
          exported_at: new Date().toISOString(),
          brand: 'TOKYO DRIFT 東京ドリフト',
          products,
          orders,
          settings,
          categories,
          sizes: availableSizes,
          promos: promoCodes,
          reviews
        };
        const blob = new Blob([JSON.stringify(fullBackup, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `tokyo_drift_database_backup_${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast('Full database JSON export downloaded.');
      };

      const handleImportDatabaseJson = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = async (evt) => {
            try {
              const parsed = JSON.parse(evt.target.result);
              if (Array.isArray(parsed.products)) setProducts(parsed.products);
              if (Array.isArray(parsed.orders)) setOrders(parsed.orders);
              if (parsed.settings && typeof parsed.settings === 'object') setSettings(parsed.settings);
              if (Array.isArray(parsed.categories)) setCategories(parsed.categories);
              if (Array.isArray(parsed.sizes)) setAvailableSizes(parsed.sizes);
              if (Array.isArray(parsed.promos)) setPromoCodes(parsed.promos);

              try {
                await fetch('/api/db/import', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(parsed)
                });
              } catch(e) {}

              showToast('Database successfully restored from backup.');
            } catch (err) {
              alert('Invalid JSON database backup file.');
            }
          };
          reader.readAsText(file);
        }
      };

      // Category Management with Native SQLite Persistence
      const handleAddCategory = async (e) => {
        if (e) e.preventDefault();
        const trimmed = (newCategoryInput || '').trim();
        if (!trimmed) return;
        const alreadyExists = categories.some(c => c.trim().toLowerCase() === trimmed.toLowerCase());
        if (alreadyExists) {
          showToast(`Category "${trimmed}" already exists.`);
          return;
        }
        playHapticTone(850, 0.04, settings.enableSound);
        const updated = [...categories, trimmed];
        setCategories(updated);
        setNewCategoryInput('');
        showToast(`Category "${trimmed}" added to collection.`);

        try {
          const res = await fetch('/api/categories', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: trimmed, categories: updated })
          });
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data.categories) && data.categories.length > 0) {
              setCategories(data.categories);
            }
          }
        } catch(err) {
          console.error('Failed to sync category to backend', err);
        }
      };

      const handleDeleteCategory = async (catToDelete) => {
        if (categories.length <= 1) {
          showToast('Collection must maintain at least one category.');
          return;
        }
        playHapticTone(400, 0.03, settings.enableSound);
        const updated = categories.filter(c => c.trim().toLowerCase() !== catToDelete.trim().toLowerCase());
        setCategories(updated);
        showToast(`Category "${catToDelete}" removed.`);

        try {
          const res = await fetch(`/api/categories/${encodeURIComponent(catToDelete)}`, {
            method: 'DELETE'
          });
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data.categories)) {
              setCategories(data.categories);
            }
          }
        } catch(err) {
          console.error('Failed to delete category on backend', err);
        }
      };

      // Filtered & Sorted products (Robust case-insensitive matching across categories & collections)
      const filteredProducts = useMemo(() => {
        return products.filter(p => {
          const targetCat = (filterCategory || 'all').trim().toLowerCase();
          const pCat = (p.category || '').trim().toLowerCase();
          const pCol = (p.collection || '').trim().toLowerCase();
          const matchesCategory = targetCat === 'all' || pCat === targetCat || pCol === targetCat;
          const matchesSize = filterSize === 'all' || (p.sizes && p.sizes.includes(filterSize));
          const matchesPrice = p.price <= priceRange;
          const matchesSearch = searchQuery === '' || 
            p.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
            pCol.includes(searchQuery.toLowerCase()) || 
            pCat.includes(searchQuery.toLowerCase()) ||
            (p.description && p.description.toLowerCase().includes(searchQuery.toLowerCase()));
          return matchesCategory && matchesSize && matchesPrice && matchesSearch;
        }).sort((a, b) => {
          if (sortBy === 'price-asc') return a.price - b.price;
          if (sortBy === 'price-desc') return b.price - a.price;
          if (sortBy === 'title') return a.title.localeCompare(b.title);
          return 0;
        });
      }, [products, filterCategory, filterSize, priceRange, searchQuery, sortBy]);

      return (
        <div className="min-h-screen bg-canvas dark:bg-canvas-dark text-noir dark:text-gray-100 flex flex-col font-sans transition-colors duration-500">

                    <input

                                  <h3 className="font-display font-bold text-xl uppercase text-noir dark:text-white leading-tight">
                                    {productForm.title || 'Untitled Product'}
                                  </h3>
                                </div>
                                <p className="font-mono text-lg font-bold text-noir dark:text-white">
                                  {formatPrice(productForm.price || 0, currency)}
                                </p>
                              </div>

                              <p className="text-xs text-taupe font-light leading-relaxed line-clamp-2">
                                {productForm.description || 'Product description will appear here...'}
                              </p>

                              {(productForm.colors || []).length > 0 && (
                                <div className="space-y-1.5 pt-2">
                                  <span className="text-[8px] font-mono tracking-widest uppercase text-taupe block">AVAILABLE COLORWAYS:</span>

                                      const name = typeof col === 'string' ? col : col.name;
                                      const hex = typeof col === 'object' && col.hex ? col.hex : '#0B0B0E';

                                </div>

                    </div>

                  {/* TAB 3: CUSTOMER ORDERS */}
                  {/* =================================================================== */}

                    const filteredOrders = orders.filter(order => {

                        (order.status && order.status.toLowerCase().includes(orderStatusFilter.toLowerCase()));
                      const q = orderSearchQuery.toLowerCase().trim();
                      if (!q) return matchesStatus;
                      const matchesQ = (order.id && order.id.toLowerCase().includes(q)) ||
                        (order.customer?.fullName && order.customer.fullName.toLowerCase().includes(q)) ||
                        (order.customer?.email && order.customer.email.toLowerCase().includes(q)) ||
                        (order.trackingNumber && order.trackingNumber.toLowerCase().includes(q));
                      return matchesStatus && matchesQ;

                    return (
                      <div className="space-y-6 fade-in">

                              value={orderSearchQuery}

                          <div className="flex flex-wrap gap-1.5 text-[10px] font-mono">
                            {[

                              { id: 'Processing', label: 'Processing' },
                              { id: 'Shipped', label: 'Shipped' },
                              { id: 'Delivered', label: 'Delivered' },

                                <button

                                                  : 'bg-noir text-white dark:bg-white dark:text-noir'

                                              if (d.success) {
                                                setOrders(prev => prev.map(o => o.id === order.id ? { ...o, status: d.status || 'Authorized' } : o));

                                              showToast('Approval request failed.');

                                                const res = await fetch(`/api/orders/${order.id}/reject-payment`, {
                                                  method: 'POST',
                                                  headers: { 'Content-Type': 'application/json', 'x-admin-key': adminPass || 'rishav@9798886818' }
                                                });
                                                const d = await res.json();
                                                if (d.success) {
                                                  setOrders(prev => prev.map(o => o.id === order.id ? { ...o, status: d.status || 'Cancelled (Payment Rejected by Concierge)' } : o));
                                                  showToast(`Order ${order.id} payment reference rejected.`);

                                                showToast('Rejection request failed.');
                                              }
                                            }

                                          className="px-3 py-2 bg-red-600 hover:bg-red-700 text-white font-mono text-[10px] uppercase font-bold rounded btn-tactile flex items-center gap-1.5 shadow-sm"

                                          <span>✕ Reject</span>
                                        </button>
                                      </div>
                                    </div>

                                              </div>
                                              <div>
                                                <p className="font-display font-medium text-noir dark:text-white">{it.title}</p>
                                                <p className="text-[10px] font-mono text-taupe uppercase">Size {it.size} · Qty {it.quantity}</p>
                                              </div>
                                            </div>
                                            <p className="font-mono font-bold">{formatPrice(it.price * it.quantity, currency)}</p>
                                          </div>
                                        ))}
                                      </div>
                                    </div>
                                  </div>

                                  <div className="pt-4 border-t border-borderMuted/40 dark:border-borderDark/40 flex flex-wrap items-center justify-between gap-4">
                                    {/* Fast Status Selector */}

                                          const newStatus = e.target.value;
                                          playHapticTone(700, 0.02, settings.enableSound);
                                          setOrders(prev => prev.map(o => o.id === order.id ? { ...o, status: newStatus } : o));
                                          showToast(`Order ${order.id} status changed to ${newStatus}`);
                                          try {
                                            await fetch(`/api/orders/${order.id}`, {
                                              method: 'PUT',
                                              headers: { 'Content-Type': 'application/json' },
                                              body: JSON.stringify({ status: newStatus })

                                          setTimeout(() => window.print(), 200);

                                        <span>🖨 Print Invoice</span>

                  </div>

                  <div className="space-y-1 text-center sm:text-right">
                    <p className="font-mono text-[10px] text-taupe uppercase">CRYPTOGRAPHIC HASH</p>
                    <p className="font-mono text-[10px] text-taupe">0x{certificateOrder.id.replace('TKD-', '')}E99A...882F</p>
                    <p className="text-[9px] text-emerald-600 font-mono">Verified Immutable Ledger</p>
                  </div>
                </div>

                {/* Actions */}
                <div className="pt-4 flex justify-center gap-3">
                  <button
                    onClick={() => window.print()}
                    className="px-6 py-2.5 border border-noir dark:border-white text-[10px] tracking-ultra uppercase hover:bg-noir hover:text-white transition-colors btn-tactile font-mono"
                  >
                    🖨 Print / Export Certificate
                  </button>
                  <button
                    onClick={() => setCertificateModalOpen(false)}
                    className="px-6 py-2.5 bg-noir text-white dark:bg-white dark:text-noir text-[10px] tracking-ultra uppercase font-mono btn-tactile"
                  >
                    Close
                  </button>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    // =========================================================================
    // PRODUCT CARD COMPONENT
    // =========================================================================
    function ProductCard({ product, index, currency, accentColor, enableSound, isWishlisted, avgRating, reviewCount, comingSoonMode, dropDate, onToggleWishlist, onOpenDetail, onQuickAdd, onOpenRestock }) {
      const [isHovered, setIsHovered] = useState(false);
      const [quickSizeSelect, setQuickSizeSelect] = useState(false);

      const totalStock = Object.values(product.stock || {}).reduce((a, b) => a + b, 0);
      const isSoldOut = !comingSoonMode && totalStock === 0;

      return (
        <div 
          className="group relative flex flex-col cursor-pointer fade-in"
          style={{ animationDelay: `${index * 60}ms` }}
          onMouseEnter={() => setIsHovered(true)}
          onMouseLeave={() => {
            setIsHovered(false);
            setQuickSizeSelect(false);
          }}
        >
          <div 
            onClick={onOpenDetail}
            className="aspect-[3/4] bg-canvas-surface dark:bg-canvas-surfaceDark overflow-hidden relative rounded-sm"
          >
            <img 
              src={product.primaryImage} 
              alt={product.title}
              className={`w-full h-full object-cover object-center transition-all duration-700 ease-out ${
                isHovered && product.altImage ? 'opacity-0 scale-105' : 'opacity-100 scale-100'
              }`}
            />

            {product.altImage && (
              <img 
                src={product.altImage} 
                alt={`${product.title} Alternate View`}
                className={`absolute inset-0 w-full h-full object-cover object-center transition-all duration-700 ease-out ${
                  isHovered ? 'opacity-100 scale-105' : 'opacity-0 scale-100'
                }`}
              />
            )}

            {/* Badges */}
            <div className="absolute top-2.5 left-2.5 sm:top-3 sm:left-3 flex flex-col gap-1 pointer-events-none">
              {isSoldOut ? (
                <span className="text-[7px] sm:text-[8px] tracking-ultra uppercase px-1.5 sm:px-2 py-0.5 bg-red-600 text-white backdrop-blur-sm font-bold">
                  SOLD OUT
                </span>
              ) : product.badge ? (
                <span className="text-[7px] sm:text-[8px] tracking-ultra uppercase px-1.5 sm:px-2 py-0.5 bg-noir/80 text-white backdrop-blur-sm">
                  {product.badge}
                </span>
              ) : null}
            </div>

            {/* 1-Click Wishlist Heart Button */}
            <button
              onClick={(e) => {
                e.stopPropagation();
                onToggleWishlist();
              }}
              className="absolute top-2.5 right-2.5 sm:top-3 sm:right-3 p-1.5 sm:p-2 bg-canvas/80 dark:bg-canvas-dark/80 backdrop-blur-md rounded-full text-noir dark:text-white hover:scale-110 active:scale-95 transition-transform shadow-md"
              aria-label="Save to Wishlist"
            >
              <svg 
                className={`w-3.5 h-3.5 stroke-[1.5] ${isWishlisted ? 'fill-current text-red-500' : 'text-taupe'}`} 
                viewBox="0 0 24 24" 
                fill={isWishlisted ? 'currentColor' : 'none'} 
                stroke="currentColor"
              >
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
              </svg>
            </button>

            {/* Mobile Quick Action Button (Visible on Touch Screens) */}
            <button
              onClick={(e) => {
                e.stopPropagation();
                if (comingSoonMode) {
                  onOpenRestock('ALL');
                } else if (isSoldOut) {
                  onOpenRestock('ANY');
                } else {
                  setQuickSizeSelect(!quickSizeSelect);
                }
              }}
              className="sm:hidden absolute bottom-2 right-2 p-2 bg-canvas/90 dark:bg-canvas-dark/90 backdrop-blur-md rounded-full text-noir dark:text-white shadow-md btn-tactile flex items-center justify-center border border-borderMuted/60 dark:border-borderDark/60"
              aria-label={comingSoonMode ? "Request VIP Drop Pass" : "Quick Add"}
            >
              {comingSoonMode ? (
                <span className="text-xs">🔔</span>
              ) : (
                <svg className="w-3.5 h-3.5 stroke-[2]" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
              )}
            </button>

            {/* Desktop / Expanded Mobile Quick-Add Bar */}
            <div 
              className={`absolute bottom-3 inset-x-3 transition-all duration-300 transform ${
                quickSizeSelect 
                  ? 'translate-y-0 opacity-100 pointer-events-auto' 
                  : isHovered 
                    ? 'translate-y-0 opacity-100' 
                    : 'translate-y-4 opacity-0 pointer-events-none'
              }`}
              onClick={(e) => e.stopPropagation()}
            >
              {comingSoonMode ? (
                <button
                  onClick={() => onOpenRestock('ALL')}
                  className="w-full py-2.5 bg-canvas/95 dark:bg-canvas-dark/95 backdrop-blur-md text-red-600 dark:text-red-400 text-[10px] tracking-ultra uppercase font-medium border border-borderMuted shadow-lg btn-tactile flex items-center justify-center gap-1.5 font-mono font-bold"
                >
                  <span>🔔 PRE-REGISTER FOR DROP</span>
                </button>
              ) : isSoldOut ? (
                <button
                  onClick={() => onOpenRestock('ANY')}
                  className="w-full py-2.5 bg-canvas/95 dark:bg-canvas-dark/95 backdrop-blur-md text-red-600 dark:text-red-400 text-[10px] tracking-ultra uppercase font-medium border border-borderMuted shadow-lg btn-tactile"
                >
                  NOTIFY WHEN RESTOCKED
                </button>
              ) : quickSizeSelect ? (
                <div className="bg-canvas/95 dark:bg-canvas-dark/95 backdrop-blur-md p-2 flex flex-wrap gap-1 justify-center border border-borderMuted dark:border-borderDark fade-in shadow-xl rounded-sm">
                  {(product.sizes || ['S', 'M', 'L', 'XL']).map(sz => {
                    const szStock = product.stock ? (product.stock[sz] || 0) : 1;
                    return (
                      <button
                        key={sz}
                        disabled={szStock === 0}
                        onClick={() => {
                          onQuickAdd(sz);
                          setQuickSizeSelect(false);
                        }}
                        className={`px-2 py-1 text-[9px] sm:text-[10px] uppercase font-mono transition-colors btn-tactile rounded ${
                          szStock === 0
                            ? 'opacity-30 line-through cursor-not-allowed'
                            : 'hover:bg-noir hover:text-white dark:hover:bg-white dark:hover:text-noir border border-borderMuted/40'
                        }`}
                      >
                        {sz}
                      </button>
                    );
                  })}
                  <button 
                    onClick={() => setQuickSizeSelect(false)}
                    className="text-[10px] px-1 text-taupe hover:text-noir ml-1"
                  >
                    ✕
                  </button>
                </div>
              ) : (
                <button
                  onClick={() => setQuickSizeSelect(true)}
                  className="w-full py-2.5 bg-canvas/95 dark:bg-canvas-dark/95 backdrop-blur-md text-noir dark:text-white text-[10px] tracking-ultra uppercase font-medium hover:bg-noir hover:text-white dark:hover:bg-white dark:hover:text-noir transition-all border border-borderMuted dark:border-borderDark shadow-lg btn-tactile"
                >
                  + QUICK ADD
                </button>
              )}
            </div>
          </div>

          <div className="pt-2.5 sm:pt-4 flex justify-between items-start gap-2" onClick={onOpenDetail}>
            <div className="space-y-0.5 sm:space-y-1 min-w-0 flex-1">
              <div className="flex items-center gap-1.5 sm:gap-2">
                <p className="text-[8px] sm:text-[9px] tracking-ultra uppercase text-taupe dark:text-gray-400 font-mono truncate">
                  {product.collection}
                </p>
                {avgRating && (
                  <span className="text-[8px] sm:text-[9px] text-amber-500 font-mono flex items-center gap-0.5">
                    ★ {avgRating}
                  </span>
                )}
              </div>
              <h4 className="font-display font-medium text-xs sm:text-base text-noir dark:text-white group-hover:text-taupe transition-colors leading-tight line-clamp-2">
                {product.title}
              </h4>
              {/* Color Swatch Dots */}
              {product.colors && product.colors.length > 0 && (
                <div className="flex items-center gap-1.5 pt-1">
                  {product.colors.slice(0, 4).map((c, cIdx) => {
                    const hex = typeof c === 'object' && c.hex ? c.hex : '#0B0B0E';
                    const name = typeof c === 'object' ? c.name : c;
                    return (
                      <span
                        key={cIdx}
                        className="w-2.5 h-2.5 rounded-full border border-black/20 dark:border-white/20 shadow-xs flex-shrink-0"
                        style={{ backgroundColor: hex }}
                        title={name}
                      />
                    );
                  })}
                  {product.colors.length > 4 && (
                    <span className="text-[8px] font-mono text-taupe leading-none">
                      +{product.colors.length - 4}
                    </span>
                  )}
                </div>
              )}
            </div>
            <p className="font-mono text-[11px] sm:text-xs text-noir dark:text-white font-medium whitespace-nowrap flex-shrink-0">
              {formatPrice(product.price, currency)}
            </p>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
